# Cloudflare Pages 用の設定ファイル
# 本番デプロイ手順:
#   1. Cloudflare ダッシュボードで Pages プロジェクトを作成
#   2. GitHub 連携でリポジトリを指定
#   3. 環境変数（SLACK_WEBHOOK_URL, RESEND_API_KEY など）を管理画面で設定
#
# 注: Pages プロジェクトでは [build] セクションは非サポート。
# ビルドコマンドは Cloudflare Pages の管理画面で設定します。

name = "ai-pedia-jp"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"
